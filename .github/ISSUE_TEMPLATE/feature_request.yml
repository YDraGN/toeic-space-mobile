name: Feature request
description: Propose a new screen, flow, or improvement
title: "[Feature]: "
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / user story
      placeholder: As a student, I want to ... so that ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Behavior, states (loading/error/empty), and edge cases.
    validations:
      required: true
  - type: input
    id: design
    attributes:
      label: Design link
      description: Figma frame or Stitch screen.
  - type: textarea
    id: api
    attributes:
      label: Backend dependency
      description: Endpoints needed and whether they already exist in toeic-space-be.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

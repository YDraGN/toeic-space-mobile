name: Bug report
description: Something does not work as expected
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app as a guest
        2. Tap ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Samsung A52, Android 13 (API 33)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / commit
      placeholder: 0.2.0 or develop@abc1234
  - type: textarea
    id: logs
    attributes:
      label: Screenshots, video, or logs
      description: Do not paste access tokens or personal data.

# TC-AUTH-01..03: the sign-up form checks each field shortly after typing stops.
# Nothing is submitted, so no account is created and no backend data changes.
appId: com.toeicspace.android
name: Sign up - live validation
tags:
  - auth
---
- launchApp:
    clearState: true
# clearState always lands on onboarding; wait out the splash before tapping.
- extendedWaitUntil:
    visible: "Bỏ qua"
    timeout: 15000
- tapOn: "Bỏ qua"
- tapOn: "ĐĂNG KÝ TÀI KHOẢN MỚI"
- extendedWaitUntil:
    visible: "Đăng ký tài khoản"
    timeout: 10000

# TC-AUTH-01: a bad email shows its error after the pause, a fixed one clears it.
- tapOn:
    id: "sign_up_email"
- inputText: "oysteic@"
- extendedWaitUntil:
    visible: "Email chưa đúng định dạng"
    timeout: 5000
- inputText: "toeicspace.vn"
- extendedWaitUntil:
    notVisible: "Email chưa đúng định dạng"
    timeout: 5000

# TC-AUTH-02: a weak password is reported without pressing the button.
- scrollUntilVisible:
    element:
      id: "sign_up_password"
    centerElement: true
- tapOn:
    id: "sign_up_password"
- inputText: "abc"
- extendedWaitUntil:
    visible: "Mật khẩu cần ít nhất 8 ký tự"
    timeout: 5000

# TC-AUTH-03: confirmation mismatch, then fixing the *password* (not the confirmation)
# must clear the mismatch error. This was the bug where the error stayed until submit.
- eraseText: 10
- inputText: "Abcdefg1!"
- scrollUntilVisible:
    element:
      id: "sign_up_confirm_password"
    centerElement: true
- tapOn:
    id: "sign_up_confirm_password"
- inputText: "Abcdefg1?"
- extendedWaitUntil:
    visible: "Mật khẩu nhập lại không khớp"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "sign_up_password"
    centerElement: true
- tapOn:
    id: "sign_up_password"
- eraseText: 10
- inputText: "Abcdefg1?"
- extendedWaitUntil:
    notVisible: "Mật khẩu nhập lại không khớp"
    timeout: 5000
- assertNotVisible: "Mật khẩu cần ít nhất 8 ký tự"
